<svg width="820" height="310" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b9bd5"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e8783a"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#40bf6a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="310" fill="#1e1e2e" rx="12"/>

  <!-- Lane labels -->
  <text x="15" y="28" fill="#5b9bd5" font-size="13" font-weight="bold">函數式・動態型別</text>
  <text x="15" y="198" fill="#e8783a" font-size="13" font-weight="bold">命令式・靜態型別</text>

  <!-- Divider -->
  <line x1="10" y1="152" x2="810" y2="152" stroke="#45475a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ── FUNCTIONAL LANE ── -->

  <!-- Lambda Calculus -->
  <rect x="15" y="42" width="155" height="58" rx="8" fill="#1d3557"/>
  <rect x="15" y="42" width="155" height="6" rx="4" fill="#5b9bd5"/>
  <text x="92" y="70" text-anchor="middle" fill="white" font-size="12" font-weight="bold">λ Lambda Calculus</text>
  <text x="92" y="89" text-anchor="middle" fill="#89b4fa" font-size="12">1936</text>

  <line x1="170" y1="71" x2="215" y2="71" stroke="#5b9bd5" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Lisp -->
  <rect x="215" y="42" width="118" height="58" rx="8" fill="#1a472a"/>
  <rect x="215" y="42" width="118" height="6" rx="4" fill="#40bf6a"/>
  <text x="274" y="70" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Lisp</text>
  <text x="274" y="90" text-anchor="middle" fill="#a6e3a1" font-size="12">1958</text>

  <!-- Fan from Lisp -->
  <line x1="333" y1="65" x2="378" y2="50" stroke="#40bf6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="333" y1="71" x2="378" y2="74" stroke="#40bf6a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="333" y1="77" x2="378" y2="100" stroke="#40bf6a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Scheme -->
  <rect x="378" y="36" width="110" height="30" rx="6" fill="#1a5276"/>
  <text x="433" y="56" text-anchor="middle" fill="white" font-size="11">Scheme  ·  1975</text>

  <!-- Clojure -->
  <rect x="378" y="60" width="110" height="30" rx="6" fill="#0e6655"/>
  <text x="433" y="80" text-anchor="middle" fill="white" font-size="11">Clojure  ·  2007</text>

  <!-- Python/Haskell -->
  <rect x="378" y="88" width="140" height="30" rx="6" fill="#4a235a"/>
  <text x="448" y="108" text-anchor="middle" fill="#d7bde2" font-size="11">Python、Haskell…</text>

  <!-- Influence callout -->
  <rect x="535" y="36" width="270" height="40" rx="6" fill="#1e1e2e" stroke="#40bf6a" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="670" y="61" text-anchor="middle" fill="#a6e3a1" font-size="12">啟發：GC · First-class fn · Dynamic typing</text>

  <!-- ── IMPERATIVE LANE ── -->

  <!-- Turing Machine -->
  <rect x="15" y="210" width="155" height="58" rx="8" fill="#4a1010"/>
  <rect x="15" y="210" width="155" height="6" rx="4" fill="#e8783a"/>
  <text x="92" y="237" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Turing Machine</text>
  <text x="92" y="257" text-anchor="middle" fill="#fab387" font-size="12">1936</text>

  <line x1="170" y1="239" x2="215" y2="239" stroke="#e8783a" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Von Neumann -->
  <rect x="215" y="210" width="148" height="58" rx="8" fill="#4a2800"/>
  <rect x="215" y="210" width="148" height="6" rx="4" fill="#e8783a"/>
  <text x="289" y="232" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Von Neumann Arch.</text>
  <text x="289" y="257" text-anchor="middle" fill="#fab387" font-size="12">1945</text>

  <line x1="363" y1="239" x2="398" y2="239" stroke="#e8783a" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- ALGOL -->
  <rect x="398" y="214" width="92" height="50" rx="6" fill="#5d4037"/>
  <text x="444" y="237" text-anchor="middle" fill="white" font-size="12" font-weight="bold">ALGOL</text>
  <text x="444" y="256" text-anchor="middle" fill="#ffccbc" font-size="11">1958</text>

  <line x1="490" y1="239" x2="528" y2="239" stroke="#e8783a" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- C -->
  <rect x="528" y="214" width="72" height="50" rx="6" fill="#7b1d1d"/>
  <text x="564" y="238" text-anchor="middle" fill="white" font-size="17" font-weight="bold">C</text>
  <text x="564" y="256" text-anchor="middle" fill="#ffcdd2" font-size="11">1972</text>

  <line x1="600" y1="232" x2="638" y2="220" stroke="#e8783a" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <line x1="600" y1="246" x2="638" y2="257" stroke="#e8783a" stroke-width="1.5" marker-end="url(#arr-orange)"/>

  <!-- Java/C++ -->
  <rect x="638" y="208" width="105" height="30" rx="6" fill="#6d1414"/>
  <text x="690" y="228" text-anchor="middle" fill="white" font-size="11">Java · C++</text>

  <!-- Go/Rust -->
  <rect x="638" y="248" width="105" height="30" rx="6" fill="#5c1111"/>
  <text x="690" y="268" text-anchor="middle" fill="white" font-size="11">Go · Rust…</text>
</svg>
